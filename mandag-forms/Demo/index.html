
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Forms</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Anmäl dig till vår workshop</h1>

    <form action="" method="get">
      <div>
        <label for="name">Namn</label>
        <input type="text" id="name" name="name" aria-describedby="name-help" placeholder="John Doe" required minlength="3" maxlength="30" autocomplete="name">
        <p id="name-help">Ange ditt för- och efternamn</p>
      </div>

      <!-- <label for="postal-code">Postnummer</label>
      <input type="text" id="postal-code" name="postal-code" autocomplete="postal-code" inputmode="numeric"> -->

      <div>
        <label for="email">E-postadress</label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required autocomplete="email">
      </div>

      <div>
        <input type="checkbox" id="newsletter" name="newsletter" value="yes" checked>
        <label for="newsletter">
          Jag vill få information om kommande workshops
        </label>
      </div>

      <fieldset>
        <legend>Vilken erfarenhetsnivå har du?</legend>
        <div>
          <input type="radio" id="beginner" name="experience" value="beginner">
          <label for="beginner">Nybörjare</label>
        </div>
        <div>
          <input type="radio" id="intermediate" name="experience" value="intermediate">
          <label for="intermediate">Har lite erfarenhet</label>
        </div>
        <div>
          <input type="radio" id="advanced" name="experience" value="advanced">
          <label for="advanced">Erfaren</label>
        </div>
      </fieldset>

      <div>
        <label for="workshop">Välj workshop</label>

        <select id="workshop" name="workshop">
          <option value="">Välj ett alternativ</option>
          <option value="html">HTML och CSS</option>
          <option value="javascript">Javascript</option>
          <option value="accessibility">Tillgänglighet</option>
        </select>
      </div>

      <!-- <div>
        <label for="participants">Antal deltagare</label>
        <input type="number" id="participants" name="participants" min="1" max="5">
      </div> -->

      <div>
        <label for="message">Övrig information</label>

        <textarea id="message" name="message" rows="4" cols="40" required></textarea>
      </div>

      <!-- <input type="password" id="password" name="password">

      <input type="number">

      <input type="date">

      <input type="tel">

      <input type="color">

      <input type="range"> -->


      <button type="submit">Skicka anmälan</button>
    </form>
  </main>
</body>
</html>
